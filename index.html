<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cans Fitness App</title>
<meta name="theme-color" content="#060A16">
<script>/* Design vor dem ersten Zeichnen setzen (kein Aufblitzen) */(function(){var t="dark";try{t=localStorage.getItem("et-theme")||"dark"}catch(e){}if(t==="auto")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="light"?"#F2F5FA":"#060A16"})()</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192-v2.png" type="image/png">

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"><b style="background:var(--kcal)"></b><b style="background:var(--p)"></b><b style="background:var(--c)"></b><b style="background:var(--f)"></b></i>Cans Fitness App</div>
    <button class="iconbtn" data-act="goProfile" aria-label="Profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </header>
  <main id="view"><div class="loading">Lade deine Daten …</div></main>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="in">
  <a href="#home" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#plan" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11h8M8 15h5"/></svg>Plan</a>
  <a href="#statistik" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistiken</a>
  <a href="#ernaehrung" data-v="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-4 4-4 8h4"/></svg>Ernährung</a>
  <a href="#profil" data-v="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</a>
</div></nav>

<div id="rest" hidden></div>
<div id="sheetwrap" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="labelIn" accept="image/*" capture="environment" hidden>
<input type="file" id="aiCamIn" accept="image/*" capture="environment" hidden>
<input type="file" id="aiGalIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>

<script src="js/ansichten.js?v=7"></script>
<script src="js/profil.js?v=2"></script>
<script src="js/aktionen.js?v=7"></script>

</html>
