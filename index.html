<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cans Fitness App</title>
<meta name="theme-color" content="#EDEFEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cans Fitness">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one-column phone app, sticky header, fixed bottom tab bar; macro colors follow Olympic plate colors (25 kg red, 20 kg blue, 15 kg yellow, 10 kg green). */
:root{
  --bg:#EDEFEB; --surface:#FFFFFF; --surface2:#E2E6E0; --ink:#161A18; --muted:#5D6660; --line:#D2D7D0;
  --accent:#1F4FD1; --on-accent:#FFFFFF;
  --kcal:#C9342A; --p:#1F4FD1; --c:#C99700; --f:#2C8553; --warn:#B86E00;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#1A1E1C; --surface2:#252A27; --ink:#E8ECE8; --muted:#9AA39D; --line:#2E3430;
  --accent:#6189FF; --on-accent:#0B0F1A; --kcal:#F05A4E; --p:#6189FF; --c:#F0C235; --f:#4DB97E; --warn:#F0A23A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#1A1E1C; --surface2:#252A27; --ink:#E8ECE8; --muted:#9AA39D; --line:#2E3430;
  --accent:#6189FF; --on-accent:#0B0F1A; --kcal:#F05A4E; --p:#6189FF; --c:#F0C235; --f:#4DB97E; --warn:#F0A23A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:20px;flex:1;display:flex;align-items:center;gap:8px}
.brand i{display:inline-flex;gap:2px}
.brand i b{width:5px;height:18px;border-radius:2px;display:block}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:26px}
h3{font-size:19px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.section{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--kcal);color:var(--kcal)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;min-height:36px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
a{color:var(--accent)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--accent)}

/* nutrition */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .d{flex:1;text-align:center;font-family:var(--display);font-size:22px;font-weight:700}
.sum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.macro{display:flex;flex-direction:column;gap:3px}
.macro .t{display:flex;justify-content:space-between;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.meal{display:flex;flex-direction:column;gap:0}
.meal .hd{display:flex;align-items:center;gap:8px;padding-bottom:6px}
.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.entry .n{flex:1;min-width:0}
.entry .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addline{border:0;background:none;color:var(--accent);font-weight:600;padding:10px 0 2px;text-align:left;display:flex;gap:6px;align-items:center;min-height:40px}
.mdots{display:inline-flex;gap:6px;font-size:13px;color:var(--muted)}
.mdots span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px;vertical-align:middle;background:currentColor}
.mdots .p::before{background:var(--p)}.mdots .c::before{background:var(--c)}.mdots .f::before{background:var(--f)}

/* equipment */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.eq{position:relative;background:var(--surface);border:2px solid transparent;border-radius:14px;padding:10px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow);min-height:118px}
.eq svg{width:64px;height:48px;color:var(--muted)}
.eq .nm{font-weight:600;font-size:14px;line-height:1.2}
.eq.on{border-color:var(--accent)}
.eq.on svg{color:var(--accent)}
.eq .ck{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px}
.eq.on .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.eqmini{width:34px;height:26px;color:var(--muted);flex:none}

/* plan */
.daycard{display:flex;flex-direction:column;gap:2px}
.exrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.exrow .sch{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rir{font-size:12px;font-weight:700;color:var(--accent)}

/* workout */
.wex{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:end;padding-top:8px;border-top:1px solid var(--line)}
.setrow .no{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted);align-self:center}
.setrow input{text-align:center;font-family:var(--display);font-size:20px;font-weight:600;padding:6px;min-height:44px}
.setrow .ok{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center}
.setrow.done .ok{background:var(--f);border-color:var(--f);color:#fff}
.setrow.done input{border-color:var(--f)}
.rirline{grid-column:2 / -1;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.rirline .lbl{margin-right:4px}
.rb{min-width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:16px}
.rb.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{font-size:14px;background:var(--surface2);border-radius:10px;padding:8px 10px}
.hint.up{border-left:3px solid var(--f)}
.sub{font-size:11px;color:var(--muted);text-align:center;margin-bottom:2px}

/* rest timer */
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);width:min(420px,calc(100% - 32px))}
#rest .t{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
#rest button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;min-width:44px;height:38px;font-weight:600;padding:0 8px}
#rest.over{background:var(--f);color:#fff}

/* sheet */
#sheetwrap{position:fixed;inset:0;z-index:40;background:rgba(10,14,12,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheethd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;min-height:40px}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li .n{flex:1;min-width:0}
.scanbox{border:2px dashed var(--line);border-radius:16px;padding:22px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.scanbox svg{width:56px;height:40px;color:var(--muted)}
.live{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.live video{width:100%;height:100%;object-fit:cover;display:block}
.live .aim{position:absolute;left:12%;right:12%;top:38%;bottom:38%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.live .stop{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:600}
.status{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.status.err{color:var(--kcal)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.stepper .v{min-width:38px;text-align:center;font-family:var(--display);font-size:22px;font-weight:700}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;min-height:48px;width:100%}
.opt span{font-size:14px;color:var(--muted)}
.opt.on{border-color:var(--accent)}
.opt.on b{color:var(--accent)}
.wizprog{display:flex;gap:4px}
.wizprog i{flex:1;height:4px;border-radius:2px;background:var(--surface2)}
.wizprog i.on{background:var(--accent)}
.navrow{display:flex;gap:10px;margin-top:6px}
.navrow .btn{flex:1}
.vrow{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:14px;padding:3px 0}
.vrow .bar{height:7px}
.vrow .num{font-size:15px;white-space:nowrap}
.weekbar{display:flex;gap:4px}
.weekbar i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
.weekbar i.on{background:var(--accent)}
.weekbar i.dl{background:var(--f)}
.weekbar i.dl.on{outline:2px solid var(--f);outline-offset:1px}
.banner{border-radius:12px;padding:10px 12px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;display:flex;gap:10px;align-items:center;border-left:3px solid var(--accent)}
.banner.warn{border-left-color:var(--warn)}
.banner.good{border-left-color:var(--f)}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);list-style:none;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
.why{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.tag.acc{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.daymini{font-size:14px;color:var(--muted)}
.aiimg{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block}
.airow{display:flex;flex-direction:column;gap:8px;padding:12px}
.airow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.airow.off{opacity:.5}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline}
.seg button{font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"><b style="background:var(--kcal)"></b><b style="background:var(--p)"></b><b style="background:var(--c)"></b><b style="background:var(--f)"></b></i>Cans Fitness App</div>
    <button class="iconbtn" data-act="profile" aria-label="Profil und Ziele"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </header>
  <main id="view"><div class="loading">Lade deine Daten …</div></main>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="in">
  <a href="#ernaehrung" data-v="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-4 4-4 8h4"/></svg>Ernährung</a>
  <a href="#training" data-v="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Training</a>
  <a href="#plan" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11h8M8 15h5"/></svg>Plan</a>
  <a href="#studio" data-v="gym"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-5 9 5v12M8 21v-7h8v7"/></svg>Studio</a>
  <a href="#verlauf" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l5-6 4 3 6-8"/></svg>Verlauf</a>
</div></nav>

<div id="rest" hidden></div>
<div id="sheetwrap" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="labelIn" accept="image/*" capture="environment" hidden>
<input type="file" id="aiCamIn" accept="image/*" capture="environment" hidden>
<input type="file" id="aiGalIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="planner.js"></script>
<script src="ai.js"></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isoDate=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>isoDate(new Date());
const fmt=(n,d=0)=>Number(n||0).toLocaleString("de-DE",{maximumFractionDigits:d,minimumFractionDigits:0});
const num=v=>{if(v===""||v==null)return null;const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:null};
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function dayLabel(d){const t=today();const y=isoDate(new Date(Date.now()-864e5));if(d===t)return"Heute";if(d===y)return"Gestern";const dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}
function shiftDate(d,n){const dt=new Date(d+"T12:00:00");dt.setDate(dt.getDate()+n);return isoDate(dt)}

/* ---------- equipment with drawings ---------- */
const EQ=[

const Store={db:null,uid:null,mode:"local",
 async init(){try{if(window.claude&&claude.use){const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(db&&user){const id=await user.id();if(id){this.db=db;this.uid=id;this.mode="db"}}}}catch(e){}},
 base(){return"data/users/"+this.uid+"/main"},
 ref(rel){return this.db.doc(rel==="main"?this.base():this.base()+"/"+rel)},
 async loadAll(){
  if(this.mode==="db"){
   const m=await this.ref("main").get();if(m.exists)Object.assign(M,clone(m.data()));
   const root=this.db.doc(this.base());
   const ds=await root.collection("days").orderBy("date","desc").limit(1000).get();ds.docs.forEach(d=>DAYS[d.id]=clone(d.data()));
   const ws=await root.collection("workouts").orderBy("start","desc").limit(1000).get();ws.docs.forEach(d=>WORKOUTS[d.id]=clone(d.data()));
  }else{
   try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith("et/"))continue;const v=JSON.parse(localStorage.getItem(k));const rel=k.slice(3);if(rel==="main")Object.assign(M,v);else{const[c,id]=rel.split("/");if(c==="days")DAYS[id]=v;else if(c==="workouts")WORKOUTS[id]=v}}}catch(e){}
  }
 },
 async write(rel,data){if(this.mode==="db"){if(data===null)return this.ref(rel).delete();return this.ref(rel).set(data)}try{if(data===null)localStorage.removeItem("et/"+rel);else localStorage.setItem("et/"+rel,JSON.stringify(data))}catch(e){}}
};
const timers={},chains={};
function dataFor(rel){if(rel==="main")return clone(M);const[c,id]=rel.split("/");if(c==="days")return DAYS[id]?{...clone(DAYS[id]),date:id}:null;return WORKOUTS[id]?clone(WORKOUTS[id]):null}
function persist(rel,now){clearTimeout(timers[rel]);const run=()=>{delete timers[rel];const data=dataFor(rel);chains[rel]=(chains[rel]||Promise.resolve()).then(()=>Store.write(rel,data)).catch(e=>{if(e&&e.code==="unavailable")setTimeout(()=>Store.write(rel,dataFor(rel)).catch(()=>toast("Speichern hat nicht geklappt. Bitte später erneut versuchen.")),1200+Math.random()*800);else if(e&&e.code==="quota_exceeded")toast("Speicher voll – alte Einträge löschen.");else toast("Speichern hat nicht geklappt.")})};if(now)run();else timers[rel]=setTimeout(run,500)}
document.addEventListener("visibilitychange",()=>{if(document.hidden)Object.keys(timers).forEach(k=>persist(k,true))});

/* ---------- targets ---------- */
function suggestTargets(p){const w=+p.weight||75,h=+p.height||175,a=+p.age||30;let bmr=10*w+6.25*h-5*a+(p.sex==="w"?-161:5);let tdee=bmr*(+p.activity||1.5);const adj={ab:-450,halten:0,aufbau:250}[p.goal]??0;const kcal=Math.round((tdee+adj)/10)*10;const pr=Math.round(w*(p.goal==="ab"?2.2:2));const fa=Math.round(w*.9);const ca=Math.max(0,Math.round((kcal-pr*4-fa*9)/4));return{kcal,p:pr,c:ca,f:fa}}
function targets(){return M.profile.targets||suggestTargets(M.profile)}

/* ---------- nutrition math ---------- */
function dayTotals(d){const t={kcal:0,p:0,c:0,f:0};const day=DAYS[d];if(!day||!day.meals)return t;for(const m of MEALS)for(const e of(day.meals[m.id]||[])){const k=e.g/100;t.kcal+=e.kcal*k;t.p+=e.p*k;t.c+=e.c*k;t.f+=e.f*k}return t}
function ensureDay(d){if(!DAYS[d])DAYS[d]={meals:{}};if(!DAYS[d].meals)DAYS[d].meals={};MEALS.forEach(m=>{if(!DAYS[d].meals[m.id])DAYS[d].meals[m.id]=[]});return DAYS[d]}

 <p class="small muted">RIR = Wiederholungen im Tank: wie viele saubere Wiederholungen nach dem Satz noch gegangen wären. Tippe eine Übung an, um sie zu tauschen oder Sätze, Wiederholungen, Pause und Gewicht zu ändern.</p></div>`;

function oldDays(P){return P.days.map((d,di)=>`<div class="card daycard"><div class="row" style="padding-bottom:6px"><h3 class="grow">${esc(d.name)}</h3><button class="btn sm ghost" data-act="start" data-d="${di}">Starten</button></div>${d.items.map(it=>{const ex=EXMAP[it.ex];return`<div class="exrow"><div class="grow">${esc(ex?ex.n:it.ex)}</div><div class="sch">${schemeTxt(it)}</div></div>`}).join("")}</div>`).join("")}

function exHistory(exId,excludeId){return Object.values(WORKOUTS).filter(w=>w.id!==excludeId).sort((a,b)=>b.start-a.start).map(w=>{const e=(w.exercises||[]).find(x=>x.ex===exId&&x.sets&&x.sets.length);return e?{date:w.date,sets:e.sets}:null}).filter(Boolean)}
function lastSets(exId,excludeId){return exHistory(exId,excludeId)[0]||null}
function daysSinceLast(){const ws=Object.values(WORKOUTS);if(!ws.length)return 0;return(Date.now()-Math.max(...ws.map(w=>w.start)))/864e5}
function setsTxt(sets){return sets.map(s=>`${fmt(s.kg,1)}×${s.reps}${s.rir!=null?" @"+s.rir:""}`).join(" · ")}

function vTrain(){
 const A=M.active;

   ${P.days.length>1?`<div class="lbl">Andere Einheit</div>${P.days.map((d,di)=>di===nd?"":`<div class="card row"><div class="grow"><b>${esc(d.name)}</b><div class="small muted">${d.items.length} Übungen</div></div><button class="btn sm ghost" data-act="start" data-d="${di}">Starten</button></div>`).join("")}`:""}`

  </div>`;
 }
 const mins=Math.floor((Date.now()-A.start)/60000);
 return`<div class="section">
 <div class="row"><div class="grow"><h2>${esc(A.dayName)}</h2><div class="small muted"><span id="elapsed">${mins}</span> min · ${A.exercises.reduce((s,e)=>s+e.sets.filter(x=>x.done).length,0)} Sätze erledigt${A.deload?" · Deload":""}</div></div><button class="btn primary" data-act="finish">Fertig</button></div>
 ${A.exercises.map((e,ei)=>{const ex=EXMAP[e.ex];const L=lastSets(e.ex,A.id);const tg=e.target;const rc=e.rec;return`<div class="card wex" data-ei="${ei}">
  <div class="row">${eqSvg(mainEq(ex),"eqmini")}<div class="grow"><h3>${esc(ex?ex.n:e.ex)}</h3><div class="small muted">${tg?`Ziel ${schemeTxt(tg)} · RIR ${tg.rir} · Pause ${restTxt(tg.rest)}`:"Freie Übung"}</div></div><button class="iconbtn" data-act="exMenu" data-ei="${ei}" aria-label="Optionen">⋯</button></div>
  ${L?`<div class="small muted">Letztes Mal (${dayLabel(L.date)}): <span class="num" style="color:var(--ink)">${setsTxt(L.sets)}</span></div>`:""}
  ${rc?`<div class="hint ${rc.kind==="up"||rc.kind==="reps"?"up":""}">${esc(rc.text)}</div>`:""}
  ${rc&&rc.stall?`<div class="hint">${esc(rc.stall)}</div>`:""}
  ${e.sets.map((s,si)=>setRow(ei,si,s,rc&&rc.reps)).join("")}
  <button class="addline" data-act="addSet" data-ei="${ei}">＋ Satz</button></div>`}).join("")}
 <button class="btn ghost block" data-act="addWEx">＋ Übung hinzufügen</button>

}
function setRow(ei,si,s,ph){return`<div class="setrow ${s.done?"done":""}" data-ei="${ei}" data-si="${si}">
 <div class="no">${si+1}</div>
 <label><div class="sub">kg</div><input type="number" inputmode="decimal" step="0.5" id="w${ei}_${si}_kg" data-w="kg" value="${s.kg??""}" placeholder="–"></label>
 <label><div class="sub">Wdh.</div><input type="number" inputmode="numeric" id="w${ei}_${si}_reps" data-w="reps" value="${s.reps??""}" placeholder="${ph??"–"}"></label>
 <button class="ok" data-act="done" aria-label="Satz erledigt">✓</button>
 <div class="rirline"><span class="lbl">RIR</span>${[0,1,2,3,4,5].map(r=>`<button class="rb ${s.rir===r?"on":""}" data-act="rir" data-r="${r}">${r===5?"5+":r}</button>`).join("")}</div></div>`}
function volume(w){return(w.exercises||[]).reduce((s,e)=>s+e.sets.reduce((a,x)=>a+(x.kg||0)*(x.reps||0),0),0)}
function e1rm(s){return(s.kg||0)*(1+((s.reps||0)+(s.rir||0))/30)}

function vStats(){
 const ws=Object.values(WORKOUTS).sort((a,b)=>a.start-b.start);
 const used=[...new Set(ws.flatMap(w=>(w.exercises||[]).map(e=>e.ex)))];
 if(!UI.statsEx||!used.includes(UI.statsEx))UI.statsEx=used[0]||null;
 let exPart=`<div class="empty small">Sobald du Trainings abschließt, siehst du hier deine Kraftkurve pro Übung.</div>`;
 if(UI.statsEx){const pts=ws.map(w=>{const e=(w.exercises||[]).find(x=>x.ex===UI.statsEx);if(!e||!e.sets.length)return null;return{x:w.date,y:Math.max(...e.sets.map(e1rm)),sets:e.sets}}).filter(Boolean);
  exPart=`<select id="statsEx" data-act="statsEx" aria-label="Übung wählen">${used.map(id=>`<option value="${id}" ${id===UI.statsEx?"selected":""}>${esc(EXMAP[id]?EXMAP[id].n:id)}</option>`).join("")}</select>

 const T=targets();const days=[];for(let i=13;i>=0;i--){const d=shiftDate(today(),-i);days.push({d,v:dayTotals(d).kcal})}
 const wts=(M.weights||[]).slice().sort((a,b)=>a.d<b.d?-1:1);

 const wk=ws.filter(w=>w.date>=weekStart).length;
 return`<div class="section"><h2>Verlauf</h2>
 <div class="grid2"><div class="card"><div class="lbl">Trainings diese Woche</div><div class="num" style="font-size:32px">${wk}${M.plan?` <span class="muted" style="font-size:18px">/ ${M.plan.days.length}</span>`:""}</div></div><div class="card"><div class="lbl">Ø kcal (7 Tage)</div><div class="num" style="font-size:32px">${fmt(avgKcal(7))}</div></div></div>
 <div class="card stack"><h3>Kraftentwicklung</h3>${exPart}</div>
 <div class="card stack"><h3>Kalorien, 14 Tage</h3>${barChart(days,T.kcal)}</div>
 <div class="card stack"><h3>Körpergewicht</h3>${wts.length>1?lineChart(wts.slice(-30).map(w=>({x:w.d,y:w.kg})),"--f","kg"):""}
  <div class="row"><input type="number" inputmode="decimal" step="0.1" id="wIn" placeholder="${fmt(M.profile.weight,1)} kg" aria-label="Gewicht heute"><button class="btn primary" data-act="addWeight">Eintragen</button></div>
  ${wts.length?`<div class="small muted">Zuletzt: ${fmt(wts[wts.length-1].kg,1)} kg (${dayLabel(wts[wts.length-1].d)})</div>`:""}</div>
 </div>`;
}
function avgKcal(n){let s=0,c=0;for(let i=0;i<n;i++){const v=dayTotals(shiftDate(today(),-i)).kcal;if(v>0){s+=v;c++}}return c?s/c:0}
function niceTicks(min,max,n=4){if(min===max){min-=1;max+=1}const span=max-min;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(6));return t}
function lineChart(pts,col,unit){
 if(!pts.length)return"";const W=340,H=170,L=38,R=12,Tp=12,B=26;
 const ys=pts.map(p=>p.y);const ticks=niceTicks(Math.min(...ys),Math.max(...ys));const y0=ticks[0],y1=ticks[ticks.length-1];
 const X=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1);const Y=v=>Tp+(1-(v-y0)/(y1-y0))*(H-Tp-B);
 const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join("");
 const area=path+`L${X(pts.length-1).toFixed(1)} ${H-B}L${X(0).toFixed(1)} ${H-B}Z`;
 const last=pts[pts.length-1];
 const lbls=pts.length>1?[0,pts.length-1]:[0];
 return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf in ${unit}">
 ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${fmt(t,1)}</text>`).join("")}
 <path d="${area}" fill="var(${col})" fill-opacity=".12"/>
 <path d="${path}" fill="none" stroke="var(${col})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
 ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?4.5:2.5}" fill="var(${col})"/>`).join("")}
 <text x="${Math.min(X(pts.length-1),W-R)}" y="${Math.max(Y(last.y)-9,11)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)" font-family="Barlow,sans-serif">${fmt(last.y,1)} ${unit}</text>
 ${lbls.map(i=>`<text x="${X(i)}" y="${H-7}" text-anchor="${pts.length===1?"middle":i?"end":"start"}" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${new Date(pts[i].x+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</text>`).join("")}
 </svg></div>`;
}
function barChart(days,target){
 const W=340,H=160,L=38,R=8,Tp=10,B=22;const max=Math.max(target*1.15,...days.map(d=>d.v));const ticks=niceTicks(0,max,3);const y1=ticks[ticks.length-1];
 const Y=v=>Tp+(1-v/y1)*(H-Tp-B);const bw=(W-L-R)/days.length;
 return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kalorien der letzten 14 Tage">
 ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${fmt(t)}</text>`).join("")}
 ${days.map((d,i)=>d.v>0?`<rect x="${L+i*bw+2}" y="${Y(d.v)}" width="${bw-4}" height="${H-B-Y(d.v)}" rx="3" fill="${d.v>target*1.05?"var(--warn)":"var(--kcal)"}" fill-opacity="${d.d===today()?1:.75}"/>`:"").join("")}
 <line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--ink)" stroke-dasharray="4 3"/>
 <text x="${W-R}" y="${Y(target)-4}" text-anchor="end" font-size="11" fill="var(--ink)" font-family="Barlow,sans-serif">Ziel ${fmt(target)}</text>
 ${[0,days.length-1].map(i=>`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="${i?"end":"start"}" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${i?"heute":new Date(days[i].d+"T12:00:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</text>`).join("")}
 </svg></div>`;
}

/* barcode decoding: native BarcodeDetector first, ZXing as fallback */
async function downscale(file,max){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(url)}}
async function decodeBarcode(file){
 if("BarcodeDetector" in window){try{const bd=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});const c=await downscale(file,1600);const r=await bd.detect(c);if(r&&r.length)return r[0].rawValue}catch(e){}}
 if(window.ZXing&&ZXing.BrowserMultiFormatReader){const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128]);const reader=new ZXing.BrowserMultiFormatReader(hints);
  for(const size of [1400,900,2000]){try{const c=await downscale(file,size);const r=await reader.decodeFromImageUrl(c.toDataURL("image/jpeg",.92));if(r)return r.getText()}catch(e){}}}
 return null;
}
async function handleCode(code){code=String(code||"").replace(/\D/g,"");if(code.length<6){scanStat("Das sieht nicht nach einem Barcode aus.",true);return}
 if(!SH)addSheet(defaultMeal(),"scan");
 const known=M.products&&M.products["b:"+code];if(known){amountSheet(known,SH.meal);return}
 scanStat(`Suche <b class="num">${code}</b> bei Open Food Facts …`);
 const p=await offLookup(code);if(!SH)return;
 if(p&&p!=="offline"){M.products[p.id]=p;persist("main");amountSheet(p,SH.meal);return}
 SH.tab="new";document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.t==="new"));renderTab({code,offline:p==="offline"});}

const OFF_FIELDS="code,product_name,product_name_de,generic_name,brands,nutriments,serving_quantity";
const r1=v=>{const x=num(v);return x==null?0:Math.round(x*10)/10};
function offMap(pr,code){const n=pr.nutriments||{};let kcal=num(n["energy-kcal_100g"]);if(kcal==null&&num(n["energy_100g"])!=null)kcal=num(n["energy_100g"])/4.184;if(kcal==null)return null;code=code||pr.code;const name=(pr.product_name_de||pr.product_name||pr.generic_name||"").trim()||"Produkt "+code;return{id:"b:"+code,code,name,brand:String(pr.brands||"").split(",")[0].trim(),kcal:Math.round(kcal),p:r1(n.proteins_100g),c:r1(n.carbohydrates_100g),f:r1(n.fat_100g),portion:num(pr.serving_quantity)||null,src:"off"}}
async function offLookup(code){try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`);if(r.status===404)return null;if(!r.ok)return"offline";const j=await r.json();if(j.status!==1||!j.product)return null;return offMap(j.product,code)}catch(e){return"offline"}}
async function offSearch(q){const box=$("#offRes");if(!box)return;q=q.trim();if(q.length<2){toast("Mindestens 2 Buchstaben eingeben.");return}
 box.innerHTML=`<div class="status">Suche bei Open Food Facts …</div>`;
 try{const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&sort_by=unique_scans_n&fields=${OFF_FIELDS}`);if(!r.ok)throw 0;const j=await r.json();
  const list=(j.products||[]).map(p=>offMap(p)).filter(p=>p&&p.code);SH.offRes=list;
  box.innerHTML=list.length?`<div class="lbl" style="padding-top:8px">Open Food Facts</div>${list.map((p,i)=>`<button class="li" data-act="pickOff" data-i="${i}"><div class="n"><div>${esc(p.name)}${p.brand?` <span class="muted small">${esc(p.brand)}</span>`:""}</div><div class="mdots"><span class="p">${fmt(p.p,1)} P</span><span class="c">${fmt(p.c,1)} KH</span><span class="f">${fmt(p.f,1)} F</span></div></div><span class="num">${fmt(p.kcal)} kcal</span></button>`).join("")}`:`<div class="status">Online nichts gefunden.</div>`;
 }catch(e){box.innerHTML=`<div class="status err">Open Food Facts ist gerade nicht erreichbar. Prüfe die Verbindung oder versuch es in einer Minute erneut.</div>`}}
/* live camera scanner: native BarcodeDetector (Android/Chrome), ZXing elsewhere (iPhone) */
let SCAN=null;
async function startLiveScan(){
 const box=$("#liveBox"),video=$("#liveVid"),st=$("#scanStart");if(!box||!video)return;
 stopLiveScan();box.hidden=false;if(st)st.hidden=true;scanStat("Kamera wird gestartet …");
 const cons={video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false};
 try{
  let native=false;if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();native=f.includes("ean_13")}catch(e){}}
  if(native){
   const stream=await navigator.mediaDevices.getUserMedia(cons);SCAN={stream};video.srcObject=stream;await video.play();
   const bd=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});scanStat("Barcode in den Rahmen halten.");
   const me=SCAN;const loop=async()=>{if(SCAN!==me)return;try{const r=await bd.detect(video);if(r&&r.length&&SCAN===me){const c=r[0].rawValue;stopLiveScan();buzz();handleCode(c);return}}catch(e){}setTimeout(loop,120)};loop();return;
  }
  if(window.ZXing&&ZXing.BrowserMultiFormatReader){
   const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
   const reader=new ZXing.BrowserMultiFormatReader(hints,150);SCAN={reader};const me=SCAN;scanStat("Barcode in den Rahmen halten.");
   await reader.decodeFromConstraints(cons,video,(res)=>{if(res&&SCAN===me){const c=res.getText();stopLiveScan();buzz();handleCode(c)}});return;
  }
  throw{name:"NoLib"};
 }catch(e){stopLiveScan();scanStat(e&&e.name==="NotAllowedError"?"Kamera-Zugriff wurde nicht erlaubt. Erlaube ihn in den Browser-Einstellungen oder nimm ein Foto auf.":e&&e.name==="NotFoundError"?"Keine Kamera gefunden.":"Live-Scanner läuft hier nicht. Nimm ein Foto auf oder tippe die Nummer ein.",true)}
}
function stopLiveScan(){const s=SCAN;SCAN=null;if(s){try{s.reader&&s.reader.reset()}catch(e){}try{s.stream&&s.stream.getTracks().forEach(t=>t.stop())}catch(e){}}
 const v=$("#liveVid");if(v){try{v.srcObject&&v.srcObject.getTracks&&v.srcObject.getTracks().forEach(t=>t.stop())}catch(e){}v.srcObject=null}
 const b=$("#liveBox");if(b)b.hidden=true;const st=$("#scanStart");if(st)st.hidden=false}
function buzz(){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function scanStat(t,err){const s=$("#scanStat");if(s)s.innerHTML=t?`<div class="status ${err?"err":""}">${t}</div>`:""}
$("#camIn").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(!SH||SH.tab!=="scan")addSheet(SH&&SH.meal||defaultMeal(),"scan");scanStat("Barcode wird gelesen …");const code=await decodeBarcode(f);if(code)handleCode(code);else scanStat("Kein Barcode erkannt. Näher ran, gerade halten, gutes Licht – oder die Nummer eintippen.",true)});

let wakeLock=null;
async function keepAwake(){try{if(navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}}catch(e){}}
function newExEntry(exId,target){
 const st=planState();const level=(M.plan&&M.plan.opts&&M.plan.opts.level)||"int";
 const rec=PL.recommend(exId,target,exHistory(exId),{level,deload:!!(st&&st.deload&&target),longBreak:daysSinceLast()>10&&Object.keys(WORKOUTS).length>0,kg:target&&target.kg});
 const L=lastSets(exId);const n=target?target.sets:3;const sets=[];
 for(let i=0;i<n;i++){const ls=L&&L.sets[Math.min(i,L.sets.length-1)];sets.push({kg:rec&&rec.kg!=null?rec.kg:(ls?ls.kg:null),reps:null,rir:null,done:false})}
 return{ex:exId,target:target||null,sets,rec}
}
function startWorkout(di){
 if(M.active){location.hash="#training";toast("Es läuft schon ein Training.");return}
 const P=M.plan,d=di>=0&&P?P.days[di]:null,st=planState();
 M.active={id:"w"+uid(),date:today(),start:Date.now(),dayName:d?d.name:"Freies Training",planDay:d?di:null,planId:d&&P.id||null,deload:!!(st&&st.deload),
  exercises:d?d.items.map(it0=>{const it=itemView(it0,st);return newExEntry(it.ex,{sets:it.sets,repMin:it.repMin,repMax:it.repMax,rir:it.rir,rest:it.rest||90,kg:it.kg||null})}):[]};
 persist("main");keepAwake();if(location.hash!=="#training")location.hash="#training";else render();
}
function finishWorkout(){
 const A=M.active;const exercises=A.exercises.map(e=>({ex:e.ex,target:e.target,sets:e.sets.filter(s=>s.done||(s.reps!=null&&s.reps!=="")).map(s=>({kg:num(s.kg)||0,reps:num(s.reps)||0,rir:s.rir}))})).filter(e=>e.sets.length);
 if(!exercises.length){openConfirm("Noch kein Satz eingetragen. Training trotzdem beenden?","Beenden ohne Speichern",()=>{M.active=null;persist("main");stopRest();render()});return}
 const w={id:A.id,date:A.date,start:A.start,end:Date.now(),dayName:A.dayName,planDay:A.planDay,planId:A.planId,deload:!!A.deload,exercises};WORKOUTS[A.id]=w;M.active=null;persist("workouts/"+A.id,true);persist("main",true);stopRest();
 try{wakeLock&&wakeLock.release()}catch(e){}
 render();
 const msg=`Gespeichert: ${exercises.reduce((s,e)=>s+e.sets.length,0)} Sätze, ${fmt(volume(w))} kg Volumen`;
 if(M.plan&&M.plan.v===2&&w.planId===M.plan.id&&!w.deload)feedbackSheet(w);else toast(msg);
}

function applyFeedback(feel){
 const w=SH.fb,P=M.plan;let changes=[];
 if(P&&P.id===w.planId&&w.planDay!=null){
  const prevBest=id=>{const h=exHistory(id,w.id)[0];return h?Math.max(...h.sets.map(PL.e1rm)):null};
  changes=PL.adapt(P,w.planDay,w,feel,prevBest,isoWeekKey());
  if(SH.pain.length){P.days.forEach(d=>d.items.forEach(it=>{if(SH.pain.includes(it.ex))it.pain=true}));changes.push(`Beschwerden gemeldet: ${SH.pain.map(id=>EXMAP[id].n).join(", ")}`)}
  P.log=P.log||[];changes.forEach(t=>P.log.unshift({d:today(),t}));P.log=P.log.slice(0,40);

/* rest timer */
let R=null,actx=null;
function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.25,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.35);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.4)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}R={end:Date.now()+sec*1000,beeped:false};const el=$("#rest");el.hidden=false;el.innerHTML=`<div class="t" id="restT"></div><button data-act="restAdj" data-n="-15">−15</button><button data-act="restAdj" data-n="15">+15</button><button data-act="restStop">OK</button>`;tickRest();clearInterval(R.int);R.int=setInterval(tickRest,250)}
function tickRest(){if(!R)return;const left=Math.round((R.end-Date.now())/1000);const t=$("#restT");const el=$("#rest");const a=Math.abs(left);if(t)t.textContent=(left<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");el.classList.toggle("over",left<=0);if(left<=0&&!R.beeped){R.beeped=true;beep()}if(left<-120)stopRest()}
function stopRest(){if(R)clearInterval(R.int);R=null;$("#rest").hidden=true}
setInterval(()=>{const e=$("#elapsed");if(e&&M.active)e.textContent=Math.floor((Date.now()-M.active.start)/60000)},15000);

/* ---------- backup ---------- */
async function exportData(){const data=JSON.stringify({app:"eisen-teller",v:1,exported:new Date().toISOString(),M,DAYS,WORKOUTS});const name=`cans-fitness-sicherung-${today()}.json`;
 try{const file=new File([data],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Cans Fitness App – Sicherung"});return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast("Sicherung gespeichert")}
$("#importIn").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(err){toast("Das ist keine gültige Sicherungsdatei.");return}
 if(!j||j.app!=="eisen-teller"||!j.M){toast("Das ist keine Sicherung der Cans Fitness App.");return}
 openConfirm(`Sicherung vom ${new Date(j.exported).toLocaleDateString("de-DE")} laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.`,"Sicherung laden",async()=>{
  try{Object.keys(localStorage).filter(k=>k.startsWith("et/")).forEach(k=>localStorage.removeItem(k))}catch(err){}
  M=Object.assign(M,j.M);DAYS=j.DAYS||{};WORKOUTS=j.WORKOUTS||{};
  await Store.write("main",clone(M));for(const id in DAYS)await Store.write("days/"+id,{...DAYS[id],date:id});for(const id in WORKOUTS)await Store.write("workouts/"+id,WORKOUTS[id]);
  render();toast("Sicherung geladen")})});
